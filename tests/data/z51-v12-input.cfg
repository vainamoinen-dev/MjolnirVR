# -------------------------------------------------------------------
#  HUD, PRESENTATION & PERFORMANCE
#  Shared intent; each title adapter maps it to that game's renderer.
# -------------------------------------------------------------------

# Game brightness / gamma. 1.0 = the game's own; higher = brighter.
# One value for Halo 3, ODST and Reach, so a change is felt in all three.
# (default 1.11, range 0.5 to 2)
game_brightness = 1.11

# How sharp the game renders inside the headset. ANY value in range
# works, so pick your own: 0.90 really means 90%, not "rounded to 80".
# The named tiers are only shortcuts in the F1 menu:
#   0.50 potato   0.75 low     1.00 medium
#   1.30 high     1.80 ultra   2.64 keith david (8K-class)
# 2912 x 2100 is 1.00; your value scales both numbers together, so the
# picture keeps its shape at every setting.
#
# YES, YOU CAN GO WAY OVER 100%. Above 1.00 is supersampling: the game
# renders bigger than the headset needs and the extra detail is
# squeezed down, which is the cleanest image available. Keith David
# (2.64) is true 8K width. The ceiling is 2.75 (8008 x 5775), and the top
# end needs a monster GPU. A bigger number is pulled back to 2.75
# instead of accepted, so a typo (20 instead of 2.0) cannot leave you
# unable to start.
#
# WARNING: anything above about 1.76 (~5K wide) is very heavy and can
# crash weaker GPUs or refuse to start. Try it in short sessions, and
# drop back down if the game won't launch.
#
# CLOSE MCC COMPLETELY and relaunch after changing this one.
# The headset projection stays full-size; the complete eye is upscaled.
# (default 1.00, range 0.35 to 2.75)
resolution_scale = 1.00

# Fit the desktop window to your monitor while the headset keeps the
# full resolution_scale render above. Turn this on when your render is
# larger than your monitor and MCC's menu (the "Halo 3" tile, Quit)
# falls off the screen edge where you can't click it. MCC still draws
# the full frame -- the headset picture and gun alignment do NOT change --
# the window is just shrunk to fit and the GPU downscales into it (no
# extra render pass, no measurable cost). 0 = off (default; the window
# behaves exactly as before). CLOSE MCC COMPLETELY and relaunch after
# changing this, the same as resolution_scale.
# (V5 default 1)
fit_desktop_window = 1

# Let the HEADSET set the frame rate, not your monitor. The VR frame
# is submitted inside MCC's desktop present, so MCC's V-Sync would
# pace your headset at your DESKTOP's refresh -- a 60 Hz desktop
# capping a 120 Hz headset. With this on, the desktop mirror presents
# unlocked and the VR runtime's own refresh (72, 90, 120, 144 Hz --
# whatever your headset reports) is the only clock. The desktop window
# may tear; the headset never does. 1 = on, 0 = stock passthrough.
# (default 1)
desktop_present_unlocked = 1

# Halo Reach crash guard: skip the input update's action tests when
# their state is not allocated (haloreach+0x65BA9). 1 = on, 0 = stock.
# (default 1)
reach_action_test_guard = 1

# While Reach loads, hand MCC a connected but neutral pad until the
# level runs. 1 = on, 0 = pass input through.
# (default 1)
reach_neutral_pad_while_loading = 1

# Halo Reach applies MCC's frame-rate limit (often 60) itself, which
# pins a 90/120 Hz headset at 60 fps and judders when you move your
# head. 1 = Reach runs uncapped (MCC's own unlimited setting, left in
# place, in and out of VR); in VR the headset paces it. 0 = no change
# to MCC's limit.
# (default 1)
reach_uncap_framerate = 1

# Dormant co-op kick probe. This production build does not collect
# Present samples or write COOPPROBE rows; both are compile-time
# disabled. The key remains for a targeted diagnostic rebuild only.
# Changing it in this build has no effect. 1 = request collection
# when such a diagnostic rebuild is used, 0 = off.
# (default 0)
coop_probe = 0

# Draw distance: how far the game renders the whole scene, as a
# fraction of stock. Applies live to all three games (Halo 3, ODST,
# Reach). 1.00 = full stock draw distance. Lower brings the far plane
# in toward you, culling distant terrain and objects (the skybox goes
# first). Most levels only start visibly culling below ~0.25, since
# nearby geometry is closer than that; the lowest settings clip near
# geometry (hard pop-in) in exchange for the most frames. Helps weaker
# machines; VR is usually CPU-limited, not GPU. No restart needed.
# (default 1.00, range 0.05 to 1.00)
draw_distance = 1.00

# Weather. Both are OFF by default because they read as a soft,
# washed-out picture in a headset. They drive the game's own switch
# for each effect and apply live, no restart. Halo: Reach is the
# game that honours these today; a game with no proven switch for an
# effect just leaves it alone and says so in HaloMCCVR.log.
#
# Rain: the streaks the rain renderer draws across your view.
# 1 = the game's normal rain, 0 = no rain.
# (default 0)
rain = 0

# Atmospheric fog: the distance haze that greys out far terrain and
# flattens contrast. Turning it off is the bigger clarity win of the
# two. 1 = the game's normal fog, 0 = no fog.
# (default 0)
atmospheric_fog = 0

# Upscale/resolve filter for the headset image: 0 = linear (old),
# 1 = sharp (strong bicubic). The game usually renders below your
# headset's per-eye resolution, so the mod upscales the difference;
# sharp keeps edges crisp instead of the linear shimmer. Live, no restart.
# (default 1)
upscale_filter = 1

# Sharpening strength (RCAS-based 2x overdrive). 0 = off, 1 = max.
# The top is intentionally aggressive and can ring/clip; adjust down.
# Same five taps and one pass as before. Live, no restart.
# (default 0.30, range 0 to 1)
sharpness = 0.30

# Anti-aliasing on the finished image: 0 = off, 1 = FXAA (balanced),
# 2 = FXAA Strong, 3 = SMAA 1x, 4 = SMAA 1x + FXAA Strong.
# Mode 4 is the most aggressive. SMAA modes cost more GPU when selected.
# Smooths jagged edges without a huge render resolution. Live.
# (default 0)
aa_mode = 4

# Eye swapchain sized so the submitted native-FOV rect is the headset's recommended size.
eye_full_density = 1

# HUD size: fraction of the view the HUD lays out into. Smaller pulls
# shields/radar/ammo toward the center so both VR eyes see them.
# Halo 3, ODST, and Reach write this into their own HUD layout data.
# (default 0.43 = calibrated stock layout, range 0.30 to 1.00)
hud_size = 0.43

# HUD width/aspect trim after automatic headset correction.
# 1 = automatic, lower = narrower, higher = wider.
# Applies to Halo 3, ODST, and Reach.
# (default 1.22, range 0.50 to 2.00)
hud_aspect = 1.22

# HUD curvature: 0 = flat, 1 = fully curved.
# 0.50 keeps the active game's authored curvature.
# Applies to Halo 3 and ODST; not Halo: Reach or Halo 4 yet.
# (default 0.48, range 0.00 to 1.00)
hud_curvature = 0.48

# HUD height in virtual-screen pixels. Positive = higher, negative = lower.
# Halo 3 and ODST; Reach and Halo 4 are not active here yet.
# (default +16, range -300 to +300)
hud_vertical_offset = +16

# Game camera motion blur: 0 = off (VR default; also removes
# repeating stereo echo artifacts), 1 = the game's normal blur.
# (default 0)
motion_blur = 0

