# ON follows ground-vehicle yaw/pitch; aircraft stay yaw-only.
# Vehicle roll stays horizon-stable.
# OFF keeps the established world-locked view.
# (default 0)
vehicle_view_follow = 0

# ON (default) parents that point to the exact interpolated seat or
# attachment node Halo renders and adds only occupant-head motion
# relative to the settled seat pose. No filter or placement shift.
# OFF uses the raw node matrices as a diagnostic A/B.
# (default 1)
vehicle_cam_smoothing = 1

# ON (default) hides only your own seated WORLD character from
# your first-person camera. Other cameras still see it, and the
# first-person arms and weapon remain. No game file is modified.
# Works with vehicle_view_follow both OFF and ON; has no effect
# when vehicle_first_person = 0.
# (default 1)
vehicle_hide_body = 1

# ON (default) hangs your arms and gun off the SEAT while you
# are riding in first person, so they stay with the vehicle and
# your hands while your head turns freely. OFF anchors them to
# Halo's seated camera, which is your character's head, so
# turning to look around drags the gun with your face.
# (default 1)
vehicle_hands_follow_body = 1

# How much of the seat's bounce reaches your view, 0 to 1.
# 1 is the engine's full travel (about 24 cm) and reads as far
# too much; 0 bolts your view to the seat. This is a strength
# control, NOT smoothing - nothing is filtered at any setting.
# (default 0.00, range 0-1)
vehicle_bounce = 0.00
# Fade to black when your head leans this far (m) out of the seat (0 = off).
vehicle_cabin_fade_m = 0.50

# ON (default) re-centres your play space when you settle into
# a seat and again when you get out, so a step you took on
# foot is not carried into the vehicle (or back out) as a
# standing lean. Position only - it never turns your view.
# (default 1)
vehicle_recenter_on_seat = 1

# Hold the game's automatic exposure steady while you are in a
# first-person seat. Looking down at a vehicle's dashboard
# fills the game's brightness measurement with a big dark
# surface, so its auto-exposure ramps the whole scene - flat
# play never shows this because nobody looks at the dash. Uses
# the game's own exposure lock and only inside the seat, so
# normal play still adapts and cutscenes still light
# themselves. ODST for now. (default 1)
vehicle_steady_exposure = 1

# ODST drop pod: looking around with your head counts as the
# "look around the pod" step (5 degrees each way). 0 = only
# the stick counts, as in the normal game. (default 1)
odst_pod_head_look = 1

# Halo CE opening tutorial: looking around with your head counts
