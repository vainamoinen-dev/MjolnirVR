dlss_debug_view = 0

# Two-handed aiming: support hand on the gun front acquires in the barrel grab zone;
# aim follows the two-hand line. 1 = on. Engage style is Toggle (grip click) or Hold (held grip).
# (default 1)
two_handed_aim = 1

# Experimental: consume the latest committed coherent Aim/Grip/head sample in XInput aim.
# (default 1)
two_hand_coherent_aim = 1

# Virtual stock changes only the base engaged two-hand orientation using the configured
# rear-reference blend. Base position/roll stay primary-controller owned;
# verified barrel-origin substitution (gun_barrel_aim) remains separate.
# (default 0)
virtual_stock = 1
# Standard and Plus remember independent rear-reference influence values.
# 0 = exact controller-to-controller solver; 1 = fully anchored stock.
# (Standard default 0.50, Plus default 0.50, range 0.00 to 1.00)
virtual_stock_standard_strength = 0.95
virtual_stock_plus_strength = 0.80
# Tracking-space vertical offset for the virtual rear reference, in meters.
# 0.000 = headset height. Negative values lower the virtual rear reference.
# (default -0.220, range -0.30 to 0.10)
virtual_stock_rear_height_m = -0.220
# Virtual Stock mode/reference: 3 = Plus; 0 = Standard Centre; 1 = Standard Shoulder.
# Legacy Chest value 2 loads as Standard Centre.
# (default 3)
virtual_stock_rear_reference = 3
# Shoulder offsets in meters: back from the head rear target and toward
# the semantic firing-hand side.
# (defaults 0.005 / 0.015, ranges 0.000..0.250 / 0.000..0.200)
virtual_stock_shoulder_back_m = 0.005
virtual_stock_shoulder_side_m = 0.015
# Legacy Chest compatibility values; not exposed by the product UI.
# (defaults -0.320 / 0.000 / 0.015, ranges -0.500..-0.220 / 0.000..0.250 / 0.000..0.200)
virtual_stock_chest_height_m = -0.320
virtual_stock_chest_back_m = 0.000
virtual_stock_chest_side_m = 0.015
# Legacy adaptive-sheet compatibility values; not exposed by the product UI.
# (defaults -0.180 / -0.450 / 0.080 / 0.140, ranges -0.350..0.000 / -0.650..-0.200 / 0.020..0.250 / 0.020..0.300)
virtual_stock_adaptive_top_height_m = -0.180
virtual_stock_adaptive_bottom_height_m = -0.450
virtual_stock_adaptive_top_half_width_m = 0.080
virtual_stock_adaptive_bottom_half_width_m = 0.140
# Plus internal support authority, retained for config compatibility.
# (default 0.50, range 0.00 to 1.00)
virtual_stock_hybrid_offhand_influence = 0.50
# Plus rear reference: 0 = Centre (internal Head), 1 = Shoulder.
# (default 0)
virtual_stock_hybrid_ads_reference = 0
# Plus broad safety distances in meters. The 0.010 m minimum
# threshold interval keeps a finite transition and accepts normal VR seating.
# (defaults 0.464 / 0.474, ranges 0.010..0.600 / 0.020..0.800 m)
virtual_stock_hybrid_seat_full_m = 0.464
virtual_stock_hybrid_seat_release_m = 0.474
# Plus horizontal unloading. These are product defaults and are not normal UI tuning.
virtual_stock_hybrid_horizontal_release = 1
virtual_stock_hybrid_horizontal_full_m = 0.330
virtual_stock_hybrid_horizontal_release_m = 0.475
# Stateless proximity release: 1 fades virtual stock as the raw primary hand
# moves away from the full rear target. 0 preserves the current solver.
# (default 1)
virtual_stock_proximity_release = 1
# Full stock through this distance; release reaches zero at the second value.
# (defaults 0.270 / 0.400, ranges 0.10..0.60 / 0.15..0.80 m)
virtual_stock_proximity_full_m = 0.270
virtual_stock_proximity_release_m = 0.425

# Reduce support-hand rotation while preserving support-position steering.
# (default 1)
two_hand_support_grip_pose = 1

# Durable owner-bound support grip; off restores spatial-only support behaviour.
# (default 1)
persistent_support_grip = 1

# VR-shooter-style controller-input smoothing strength: 0 = off/raw controller
# input; 25 = the full fixed speed-25 quaternion-native filter; values between
# wet/dry mix the filtered directional input copies over raw. Two-handed aim
# with Virtual Stock on or off; raw poses and the weapon/base position are
# never smoothed.
# (default 0.00, range 0.00 to 25.00)
two_hand_smoothing_strength = 0.00

# Free two-hand (VS-OFF) support-steering authority: 0 = the primary
# controller's own aim is authoritative; 1 = the support controller's aim
# carries equal authority. VS-OFF free two-hand aiming only; Virtual Stock
# is unaffected.
# (default 0.50, range 0.00 to 1.00)
two_hand_offhand_influence = 0.50

# Persistent-grip switch option: 1 = a weapon switch while the grip is held
# keeps the two-hand hold on the new weapon immediately (no re-orientation).
# 0 = grip the new weapon normally; the grip button need not be released.
# (default 0)
two_hand_switch_inherit = 0

# Main weapon, aim and trigger on the physical left controller.
# Movement, turning and face buttons keep their physical bindings.
left_handed = 0

# Experimental anatomical hand alignment; only active with left_handed.
# Default off preserves the released hand positioning.
experimental_hand_alignment = 0

# Engage style: 1 = toggle (click grip on/off), 0 = hold.
# (default 0)
two_hand_toggle = 0

# Left controller wrist-to-palm correction for support-hand seating/IK, in meters.
# Excluded from the two-hand aim line, which uses raw tracked points.
# (default -0.063, range -0.15 to 0.30)
left_hand_forward_m = -0.063

# Sideways nudge of the two-hand grab zone (+ = player's right), so the
# grab line sits on the visible barrel, in meters.
# (default 0.030, range -0.10 to 0.10)
two_hand_zone_right_m = 0.030

# Extra two-hand grab radius: widens the barrel grab zone sideways and
# lengthens it at both ends, in meters. 0 = the weapon's own zone.
# (default 0.060, range 0 to 0.10)
two_hand_grab_extra_m = 0.060

# Support grip: squeezed above `press`, let go at or below `release`;
# fresh_press 1 = hold mode grabs only within 250 ms of the squeeze.
two_hand_grip_press = 0.80
two_hand_grip_release = 0.65
two_hand_fresh_press = 1

# Two-hand aim follows the rear-hand -> support-hand line exactly (overrides
# two_hand_offhand_influence and the gun_yaw/pitch trim while two-handed).
two_hand_exact_line = 1
# One-handed weapons (pistols): the support hand only attaches visually; aim stays one-handed.
pistol_two_hand_visual_only = 1

# Enclosed vehicles (Wraith, Halo 2 Scorpion/Wraith): lift the eye toward the hatch so you can see out.
# An explicit per-seat trim always wins. (default 0)
vehicle_cockpit_eye_up = 0

# Cockpit screen: enclosed vehicles show the view from a forward hull camera on a framed screen
# in the cockpit (Reach Scorpion, Wraith, Banshee, Seraph). Size/placement in metres; the camera
# is ahead of the seat (0 = per class); refresh divisor 2 = every other frame. (default 1)
vehicle_cockpit_screen = 1
cockpit_screen_width_m = 0.60
cockpit_screen_distance_m = 0.45
cockpit_screen_offset_y_m = 0.00
cockpit_screen_fov_deg = 90
cockpit_screen_ahead_m = 0.00
cockpit_screen_refresh_divisor = 2

# Tuned two-hand grab zone (F1 Weapon tuning): centre along the barrel,
# half length and radius in meters. Any 0 = the weapon's own zone.
# Per-gun alignment saves these per weapon (weapon_alignment_*_grab_*).
two_hand_grab_centre_m = 0.000
two_hand_grab_half_length_m = 0.000
two_hand_grab_radius_m = 0.000

# Support-hand haptic tick on two-hand grab; release ticks at half. 0 = off.
# (default 0.20, range 0 to 1)
two_hand_grab_haptic = 0.200

# Support-controller-to-palm depth for two-hand grab acquisition only, in meters.
# Does not change aim geometry, hand seating, or shots.
# (default 0.097, range -0.05 to 0.25)
left_grip_forward_m = 0.097

# VRIK arm IK: 1 = bend the arm to your controller (shoulder planted,
# elbow solved); 0 = rigid-parent the whole arm assembly. Required on
# Halo 3 / ODST, so leave it 1.
# (default 1)
arm_ik = 1

# Floating hands: 1 = show only the hands and the guns they hold
# (arms hidden); 0 = show arms where a verified tracked chain is available.
# (default 1)
floating_hands = 1
# Halo 3 / ODST: collapse arm joints onto the wrist instead of shrinking them in place (default 0).
floating_hands_collapse_at_wrist = 0

# World collision (experimental): hands and held weapons stop on
# world geometry and provide gentle contact haptics. Implemented for
# Halo 2, Halo 3, ODST, Reach, and Halo 4.
# (default 0)
world_collision = 0

# True physical melee (experimental): a fast tracked hand/weapon
# contact damages the struck target. Independent of world_collision.
# Implemented for Halo 2, Halo 3, ODST, Reach, and Halo 4.
# (default 1)
physical_melee = 1
# Fist melee: a bare hand strikes only as a fist (grip squeezed in open air).
# (default 1)
melee_fist = 1
# Gesture melee: connect a fast swing to the active game's melee binding.
# (default 0)
gesture_melee = 0
# Required controller/weapon sample speed in metres per second.
# (default 2.20, range 0.3 to 10.0)
physical_melee_swing_speed = 2.20
# Seconds per hand before another strike (default 0.30, range 0.06 to 1.0).
physical_melee_cooldown_s = 0.30

# Lower the right (weapon) shoulder so the arm doesn't clip your face
# (0 = authored, higher = lower; ~world units).
# (default 0.060, range 0 to 0.3)
right_shoulder_drop = 0.060

# Push BOTH shoulders back toward your torso, along your heading.
# Some titles (e.g. ODST) plant the shoulders in front of you;
# raise this until they sit at your body. Negative = forward.
# (default 0.000, range -0.3 to 0.3; ~world units)
shoulder_back_m = 0.000

# Keep the IK shoulders level with the horizon instead of pitching
# with your head. 1 = level torso (shoulders stay put); 0 = old.
# (default 1)
shoulder_level = 1

# VRIK stage A1: show the player's game-animated body (experimental).
# (default 0)
body_wip = 0

# Experimental H3/H4 tracked avatars and supported free-hand finger poses.
# Overrides the legacy H3 body switch; unsupported rigs retain first-person hands.
experimental_body_ik = 0
# Hide separate lower-body regions; H3 Elite/Arbiter require this off.
body_ik_hide_lower = 0

# -------------------------------------------------------------------
#  DEVELOPMENT DIAGNOSTICS
#  Leave these off unless a developer asks you to enable one.
# -------------------------------------------------------------------

# Diagnostic: 1 ignores the controller and pushes the weapon a fixed
# distance left, to test whether the gun mesh reads our matrices.
# (default 0)
weapon_probe = 0

# Diagnostic: 1 logs the CHUD state-byte window on change (finds the
# enemy-red reticle state and per-element HUD flags). Log-only.
# Not in the F1 menu; this file only. (default 0)
hud_probe = 0

# Diagnostic: 1 logs each distinct scene render target MCC binds
# (size/format/flags + viewport) so toggling MCC's built-in FSR shows
# what it changes. Not in the F1 menu; this file only. (default 0)
fsr_probe = 0

# Diagnostic: log camera-vs-muzzle offset on each shot (bullet origin).
# Not in the F1 menu; this file only. (default 0)
bullet_probe = 0

# Ghosting diagnostic: 1 renders the right eye first.
# (default 0)
right_eye_first = 0
