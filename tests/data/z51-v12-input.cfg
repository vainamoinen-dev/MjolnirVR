# ===================================================================
#  Halo MCC VR settings
# ===================================================================
#  Edit this file in Notepad with MCC CLOSED, or press F1 in game.
#  Every setting below lists what it does and its default value, so
#  you can always put one back the way it was.
#  This ONE file is shared by every supported MCC game. Your comfort,
#  control, aiming, and presentation preferences follow you between
#  titles; each game keeps its own internal engine calibration.
#
#  * Lost? Close MCC, DELETE this file, and start the game. A fresh
#    one with all the defaults is written for you. Nothing else in
#    the mod folder is affected.
#  * The F1 menu rewrites this whole file when it saves, so notes you
#    type in yourself will disappear. Your VALUES are always kept.
#  * resolution_scale needs a full game restart. Everything else
#    takes effect the next time you launch, or live in the F1 menu.
#  * A line the mod does not recognize, or a value that is not a
#    number, is ignored and noted in HaloMCCVR.log. It cannot break
#    the mod, and out-of-range numbers are pulled back into range.
# ===================================================================

config_version = 12

# -------------------------------------------------------------------
#  OPENXR & COMFORT
#  Headset, controller feedback, and the shared 2D menu screen.
# -------------------------------------------------------------------

# OpenXR controller vibration strength, 0 = off and 1 = full.
# (default 0.86, range 0 to 1)
haptic_intensity = 0.86

# Headset micro-smoothing, 0 = raw. Try 0.05 only for micro-jitter.
# (default 0.03, range 0 to 0.10)
headset_smoothing = 0.03

# Width of the virtual screen in meters (menus / 2D mode).
# (default 4.00, range 0.5 to 20)
screen_width_m = 4.00

# Distance from your head to that screen, in meters.
# (default 2.40, range 0.3 to 20)
screen_distance_m = 2.40

# Stereo 3D theatre for engine-confirmed cutscenes where the game
# has taken camera control away from the player. Shared by every
# supported title, including future title adapters. (default 1)
cutscene_theater_enabled = 1
# Fade to black on both ends of each 3D <-> theatre/flat switch, ms (default 150, 0 = cut).
cutscene_fade_ms = 150
# Cutscene sections that stay 3D with free head look, e.g. odst:3, reach:*
# (titles ce h2 h3 odst reach h4; the log names each theatre section).
cutscene_3d_sections = 

# Theatre stereo separation: 0 = flat, 1 = natural IPD, 2 = double.
# (default 1.00, range 0 to 2)
cutscene_theater_depth = 1.00

# Swap the theatre's left/right images to reverse depth. (default 0)
cutscene_theater_flip_depth = 0

# Room-fixed theatre screen width and distance in meters. Its height
# follows the authored cinematic projection.
# (defaults 6.00 wide at 4.00 away)
cutscene_theater_width_m = 6.00
cutscene_theater_distance_m = 4.00

# Black cine bars on the theatre screen. The cutscene is drawn into the
# headset's render shape, which is taller than a TV picture, so without
# bars you see scene above and below the shot the game intends. This is
# the shape left showing between the bars: 1.78 = 16:9 (a TV), 2.39 =
# a wide cinema crop, 0 = no bars. The picture is never resized, only
# covered. (default 1.78, range 1.0 to 3.0, or 0)
cutscene_theater_matte_aspect = 1.78
# Slides that window up (positive) or down inside the frame, as a
# fraction of the picture height. (default 0.00, range -0.25 to 0.25)
cutscene_theater_matte_offset = 0.00

# Show the game's own subtitle text on the theatre screen. Subtitles
# are interface text the game draws after the two eye images are
# taken, which is why they appear on the monitor but not in the
# headset. Turn MCC's own subtitle setting on as well. (default 1)
cutscene_theater_subtitles = 1

# How much of the bottom of the game's frame is searched for that
# text, as a fraction of its height. Text drawn higher than this is
# never found, so raise it if subtitles do not appear.
# (default 0.30, range 0.05 to 1.0)
cutscene_theater_subtitle_band = 0.30

# Diagnostic. Paints that strip onto the theatre screen exactly as it
# was captured, with no text selection at all, so you can see what the
# mod is reading. Leave off for normal play. (default 0)
cutscene_theater_subtitle_debug = 0

# Where the F1 menu panel floats. You do not need to edit these by
# hand: grab the bar along the top of the panel with your right
# trigger to move it, and push the right stick up/down while holding
# to change how far away it is. "Reset panel position" in the menu's
# Advanced page puts all four back to the defaults below.
# (defaults 1.20 / 1.10 / -0.08 / 0.00)
# Distance from your head to the panel, in meters. (range 0.40 to 6.00)
menu_distance_m = 1.20
# Panel width in meters; its height follows automatically. (range 0.40 to 4.00)
menu_width_m = 1.10
# Height offset in meters, negative = below your eye line. (range -3.00 to 3.00)
menu_height_m = -0.08
# Sideways offset in meters, positive = to your right. (range -3.00 to 3.00)
menu_side_m = 0.00

# Aim the primary controller at MCC / pause menus; trigger clicks.
# Optional; requires MCC desktop focus. Does not affect gameplay or F1.
game_menu_pointer = 1

# Show the welcome page by itself once at the start of each launch.
# Tick "Don't show this again" on that page to clear this. The page
# itself always stays in the F1 menu, so you can read it again later.
# (default 1)
show_welcome = 0

# -------------------------------------------------------------------
#  CONTROLS & TURNING
#  Universal controller choices used in every supported title.
# -------------------------------------------------------------------

# VR turning with the right controller stick: 0 = snap, 1 = smooth.
# (default 1)
turn_smooth = 0

# Temporarily use smooth VR turning in vehicles; keep the saved on-foot mode.
# Default off. Native vehicle steering retains its own controls and limits.
vehicle_smooth_turn = 0

# Physical horizontal movement drives native walking while on foot.
# Default off. Controller aiming is preserved; walking stays head-relative.
roomscale_movement = 0

# Degrees per snap turn.
# (default 30, range 5 to 90)
turn_snap_deg = 30

# Smooth turn speed in degrees per second.
# (default 120, range 30 to 360)
turn_smooth_deg_s = 120

# Press Y+B together to send Start (pause/resume) in supported titles.
# (default 0)
y_b_start_chord = 0

# Halo 2 only: the gamepad's Back/View button is MCC's instant
# Classic <-> Anniversary graphics switch. 0 = the mod swallows that
# button in Halo 2 so a physical pad (Steam Controller) cannot flip the
# renderer mid-game; 1 = pass it through. Holding the left stick
# click with the controller at your head switches renderers on
# purpose in either setting. Y+B still pauses on the pad.
# (default 0)
halo2_gamepad_graphics_switch = 0

# Hold this controller next to your head to use the left stick as D-pad:
# 0 = left controller, 1 = right controller.
# While held, clicking the left stick presses the controller's
# left centre button (Back/View) - ODST's map/objectives screen.
# (default 0)
dpad_hand = 0

# Head-gesture activation radius in metres. A smaller radius requires
# the selected controller to be closer to your head.
# (default 0.30, range 0.10 to 0.50)
dpad_head_radius = 0.300

# Quest 3 alternate D-pad: touch the left controller's thumb rest,
# then move the right stick. Always uses the physical left thumb rest
# and physical right stick, including in left-handed mode.
# (default 0)
quest_thumbrest_dpad = 0

# Block the configured flashlight gamepad button during gameplay; XR grip/two-hand aim and menus stay available.
flashlight_mapping_version = 2
disable_flashlight_input = 0
# Match MCC's layout per title: 0=RB,1=LB,2=DUp,3=DDown,4=DLeft,5=DRight,6=X,7=Y,8=A,9=B,10=L3,11=R3,12=Back,13=LT,14=RT.
