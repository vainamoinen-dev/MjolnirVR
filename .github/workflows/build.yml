# Build and test on every push and pull request: the Release DLL, launcher and tools, then the offline test suite
# (ctest; no game or headset needed). A second job checks the source layout with the pinned clang-format.
name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The layout is clang-format 19.1.5's (.clang-format); another version may lay the same code out differently.
      - run: python -m pip install clang-format==19.1.5
      - name: Check layout
        shell: bash
        run: git ls-files '*.cpp' '*.h' '*.inl' | xargs clang-format --dry-run --Werror

  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          # Two LOG guards compare against older commits; without the history they report "skipped".
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The release preset reads dependencies from out/deps for offline local builds; empty values download them.
      - name: Configure
        run: >
          cmake --preset release
          -DFETCHCONTENT_SOURCE_DIR_OPENXR=
          -DFETCHCONTENT_SOURCE_DIR_MINHOOK=
          -DFETCHCONTENT_SOURCE_DIR_IMGUI=
      - name: Build
        run: cmake --build --preset release --parallel
      - name: Test
        run: ctest --test-dir out/build/release -C Release --output-on-failure
